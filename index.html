<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manuel Breda – Architetto</title>
<meta name="description" content="Servizi tecnici integrati per l’edilizia. Manuel Breda, architetto a Cles (TN).">
<link rel="icon" href="img/favicon.png">
<style>
@font-face{font-family:"Jost";font-weight:300;font-style:normal;font-display:swap;src:url(fonts/jost-latin-300-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Jost";font-weight:300;font-style:normal;font-display:swap;src:url(fonts/jost-latin-ext-300-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#d0d3d2;--fg:#454746;--soft:#6d706f}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{font-family:"Jost","Avenir Next","Century Gothic",Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.7;letter-spacing:.04em;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .35s ease}
a:hover,a:focus-visible{background-size:100% 1px}
a:focus-visible{outline:1px solid currentColor;outline-offset:4px}
p,h1{margin:0}
.page{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(28px,6vw,72px)}
.mono{width:clamp(96px,16vw,168px);height:auto;display:block}
.bottom{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:end}
h1{font-size:0;line-height:0}
.brand{width:min(100%,clamp(260px,36vw,460px))}
.brand img{display:block;height:auto}
.nome{width:100%}
.arch{width:50.96%;margin-top:28px}
.tag{margin-top:22.5px}
address{font-style:normal;justify-self:end}
.s{color:var(--soft)}
.full{display:none}
@media(max-width:700px){.bottom{grid-template-columns:1fr;gap:32px}address{justify-self:start}}
@media(min-width:701px){
.page{display:grid;grid-template-columns:100%;grid-template-rows:minmax(140px,1fr) auto minmax(140px,1fr);justify-items:center;align-content:stretch}
.bottom{display:contents}
.mono,.brand{display:none}
.id{--w:clamp(300px,34vw,480px);grid-row:2;width:var(--w);display:flex;flex-direction:column;align-items:center;text-align:center}
.full{display:block;width:var(--w);height:auto}
.tag{margin-top:calc(var(--w)*.0779 - 5px)}
address{grid-row:3;align-self:end;justify-self:end;text-align:left}
}
@media(prefers-reduced-motion:no-preference){.page img{animation:in 1.1s ease both}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<div class="page">
  <img class="mono" src="img/monogramma-mb.png" alt="MB" width="168">
  <div class="bottom">
    <div class="id">
      <img class="full" src="img/logo-mb-completo.png" alt="Manuel Breda – Architetto" width="732" height="411">
      <h1 class="brand"><img class="nome" src="img/manuel-breda.png" alt="Manuel Breda" width="732" height="42"><img class="arch" src="img/architetto.png" alt="Architetto" width="373" height="26"></h1>
      <p class="tag">Servizi tecnici integrati per l’edilizia</p>
    </div>
    <address>
      <p>Via Trento, 130 – Cles (TN)</p>
      <p class="s">P. IVA 02673200222</p>
      <p style="margin-top:14px"><a href="tel:+393383325925">+39 338 332 5925</a></p>
      <p><a href="mailto:breda.architetto@gmail.com">breda.architetto@gmail.com</a></p>
      <p><a href="mailto:manuel.breda@archiworldpec.it">manuel.breda@archiworldpec.it</a></p>
    </address>
  </div>
</div>
</body>
</html>
